name: Publicar no Instagram
on:
  # Agendador ligado em 20/10/2026 com ok do dono.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só testar (não publica)"
        type: boolean
        default: false
  # Mudança no manifest publica na hora o que já estiver no horário.
  push:
    branches: [main]
    paths: ["docs/manifest.json"]
permissions:
  contents: write
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publicar o que já está na hora (ou só testar)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL || 'https://planodefuga-br.github.io/plano-de-fuga' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python publisher/publish.py
      - name: Salvar estado e resultado do teste
        if: always()
        run: |
          git config user.name "plano-de-fuga-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in publisher/state.json publisher/teste.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "estado de publicação" && git push)
